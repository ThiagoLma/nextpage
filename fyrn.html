<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nextpage - Gerenciador de Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080a;
            --bg-secondary: #0f0f12;
            --bg-card: #141417;
            --bg-elevated: #1a1a1e;
            --accent: #a78bfa;
            --accent-strong: #8b5cf6;
            --accent-glow: rgba(167, 139, 250, 0.12);
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #63636b;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --green: #34d399;
            --amber: #fbbf24;
            --blue: #60a5fa;
            --red: #f87171;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: var(--accent-glow);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 5px;
            border: 3px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(1.25rem, 5vw, 2.5rem);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: -0.01em;
            border: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: var(--accent-strong);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            transition: stroke 0.2s ease;
        }

        .btn-icon:hover svg {
            stroke: var(--accent);
        }

        .btn-icon.danger:hover {
            background: rgba(239, 68, 68, 0.12);
        }

        .btn-icon.danger:hover svg {
            stroke: var(--red);
        }

        /* ============ NAVBAR ============ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 10, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
        }

        .logo .logo-word span {
            color: var(--accent);
        }

        .logo-badge {
            margin-left: 0.75rem;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(167, 139, 250, 0.22);
            padding: 0.22rem 0.6rem;
            border-radius: 100px;
        }

        /* ============ DASHBOARD HERO ============ */
        .dashboard {
            position: relative;
            padding: clamp(3.5rem, 10vh, 6.5rem) 0 0;
        }

        .dashboard-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .dashboard-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 10%, transparent 70%);
            will-change: transform;
        }

        .dashboard .container {
            position: relative;
            z-index: 2;
        }

        .dashboard-header {
            max-width: 640px;
            margin-bottom: clamp(3rem, 8vh, 5rem);
        }

        .dashboard-kicker {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dashboard-kicker::before {
            content: '';
            width: 20px;
            height: 1px;
            background: var(--accent);
        }

        .dashboard-title {
            font-size: clamp(2rem, 5.5vw, 3.25rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.08;
            margin-bottom: 1.25rem;
            text-wrap: balance;
        }

        .dashboard-title span {
            color: var(--accent);
        }

        .dashboard-subtitle {
            color: var(--text-secondary);
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.7;
        }

        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-bottom: clamp(3.5rem, 9vh, 5.5rem);
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1.25rem 1.5rem;
            transition: border-color 0.25s ease, background 0.25s ease;
        }

        .stat-card:hover {
            border-color: var(--border-strong);
            background: var(--bg-card);
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 0.35rem;
        }

        .stat-card.total .stat-value { color: var(--accent); }
        .stat-card.done .stat-value { color: var(--green); }
        .stat-card.progress .stat-value { color: var(--amber); }
        .stat-card.review .stat-value { color: var(--blue); }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ============ PROJECTS SECTION ============ */
        .projects {
            padding-bottom: 4rem;
        }

        .projects-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .projects-head h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.75rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box svg {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            stroke: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            color: var(--text);
            font-size: 0.875rem;
            font-weight: 450;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            border-color: rgba(167, 139, 250, 0.4);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.08);
        }

        .filter-group {
            display: flex;
            gap: 0.25rem;
            flex-wrap: wrap;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.25rem;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 550;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-secondary);
        }

        .filter-btn.active {
            background: var(--accent-glow);
            color: var(--accent);
        }

        /* Project cards */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-strong);
        }

        .project-cover {
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .project-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(8, 8, 10, 0.5), transparent 60%);
        }

        .project-initials {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.85);
            transition: transform 0.4s ease;
            z-index: 1;
        }

        .project-card:hover .project-initials {
            transform: scale(1.05);
        }

        .project-cover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 10, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .project-cover:hover .project-cover-overlay {
            opacity: 1;
        }

        .project-cover-overlay .btn {
            transform: translateY(8px);
            transition: transform 0.3s ease;
        }

        .project-cover:hover .project-cover-overlay .btn {
            transform: translateY(0);
        }

        .project-status {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.3rem 0.7rem;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(8, 8, 10, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .project-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .status-done { color: var(--green); }
        .status-done::before { background: var(--green); }
        .status-progress { color: var(--amber); }
        .status-progress::before { background: var(--amber); }
        .status-review { color: var(--blue); }
        .status-review::before { background: var(--blue); }
        .status-planned { color: var(--accent); }
        .status-planned::before { background: var(--accent); }

        .project-body {
            padding: 1.25rem 1.25rem 1.1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .project-category {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .project-name {
            font-size: 1.05rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
            flex: 1;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.22rem 0.55rem;
            border-radius: 100px;
        }

        .project-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border);
        }

        .project-date {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .project-actions {
            display: flex;
            gap: 0.15rem;
        }

        .project-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .project-link-btn:hover {
            background: var(--accent-glow);
        }

        .project-link-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
        }

        .empty-state svg {
            width: 52px;
            height: 52px;
            stroke: var(--text-muted);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }

        .modal-head h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        .modal-close svg {
            width: 16px;
            height: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 550;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.7rem 0.9rem;
            color: var(--text);
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(167, 139, 250, 0.4);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.08);
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: var(--bg-card);
            color: var(--text);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            color: var(--text);
            padding: 0.8rem 1.4rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 550;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast::before {
            content: '';
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
        }

        /* ============ FOOTER ============ */
        .footer {
            padding: 2.5rem 0;
        }

        .footer .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .footer p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            font-size: 0.82rem;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        /* ============ REVEAL ============ */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo"><span class="logo-word">next<span>page</span></span><span class="logo-badge">Hub</span></a>
        </div>
    </nav>

    <!-- Dashboard -->
    <section class="dashboard">
        <div class="dashboard-bg">
            <div class="dashboard-grid" data-parallax="0.15" data-parallax-y="10"></div>
        </div>
        <div class="container">
            <div class="dashboard-header reveal">
                <p class="dashboard-kicker">Portf&oacute;lio &amp; Projetos</p>
                <h1 class="dashboard-title">Minhas <span>landing pages</span> em um s&oacute; lugar</h1>
                <p class="dashboard-subtitle">Organize, acompanhe o status e acesse cada projeto criado.</p>
            </div>

            <!-- Stats -->
            <div class="stats-grid reveal">
                <div class="stat-card total">
                    <div>
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-label">Total de projetos</div>
                    </div>
                </div>
                <div class="stat-card done">
                    <div>
                        <div class="stat-value" id="statDone">0</div>
                        <div class="stat-label">Conclu&iacute;dos</div>
                    </div>
                </div>
                <div class="stat-card progress">
                    <div>
                        <div class="stat-value" id="statProgress">0</div>
                        <div class="stat-label">Em andamento</div>
                    </div>
                </div>
                <div class="stat-card review">
                    <div>
                        <div class="stat-value" id="statReview">0</div>
                        <div class="stat-label">Em revis&atilde;o</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects -->
    <section class="projects">
        <div class="container">
            <div class="projects-head reveal">
                <h2>Projetos</h2>
                <span class="navbar-count" id="visibleCount" style="display:none;"></span>
            </div>

            <div class="toolbar reveal">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Buscar projeto por nome ou categoria...">
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="done">Conclu&iacute;dos</button>
                    <button class="filter-btn" data-filter="progress">Em andamento</button>
                    <button class="filter-btn" data-filter="review">Revis&atilde;o</button>
                    <button class="filter-btn" data-filter="planned">Planejados</button>
                </div>
            </div>

            <div class="projects-grid" id="projectsGrid">
                <!-- Rendered by JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <a href="#" class="logo"><span class="logo-word">next<span>page</span></span> Hub</a>
            <div class="footer-links">
                <a href="https://github.com/ThiagoLma" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://www.instagram.com" target="_blank" rel="noopener">Instagram</a>
            </div>
            <p>&copy; <span id="year"></span> nextpage. Gerenciador de portf&oacute;lio.</p>
        </div>
    </footer>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal">
            <div class="modal-head">
                <h2 id="modalTitle">Novo Projeto</h2>
                <button class="modal-close" id="modalClose" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="form-group">
                    <label for="projectName">Nome do projeto *</label>
                    <input type="text" id="projectName" placeholder="Ex: Landing Page Restaurante" required>
                </div>
                <div class="form-group">
                    <label for="projectUrl">URL / Link *</label>
                    <input type="url" id="projectUrl" placeholder="https://seuprojeto.com.br" required>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="projectCategory">Categoria</label>
                        <select id="projectCategory">
                            <option value="Landing Page">Landing Page</option>
                            <option value="Site Institucional">Site Institucional</option>
                            <option value="E-commerce">E-commerce</option>
                            <option value="Portf&oacute;lio">Portf&oacute;lio</option>
                            <option value="Sistema Web">Sistema Web</option>
                            <option value="UI/UX">UI/UX</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="projectStatus">Status</label>
                        <select id="projectStatus">
                            <option value="planned">Planejado</option>
                            <option value="progress">Em andamento</option>
                            <option value="review">Em revis&atilde;o</option>
                            <option value="done">Conclu&iacute;do</option>
                        </select>
                    </div>
                </div>
                <div class="form-group full">
                    <label for="projectTech">Tecnologias (separadas por v&iacute;rgula)</label>
                    <input type="text" id="projectTech" placeholder="HTML, CSS, JavaScript, React">
                </div>
                <div class="form-group full">
                    <label for="projectDesc">Descri&ccedil;&atilde;o</label>
                    <textarea id="projectDesc" placeholder="Breve descri&ccedil;&atilde;o do projeto..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="modalCancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="modalSave">Salvar Projeto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        const STORAGE_KEY = 'nextpage_projects_v1';

        const COVER_GRADIENTS = [
            'linear-gradient(135deg, #18181b, #2e1065)',
            'linear-gradient(135deg, #141414, #043c2e)',
            'linear-gradient(135deg, #161616, #102a43)',
            'linear-gradient(135deg, #171717, #3f2500)',
            'linear-gradient(135deg, #191919, #3b0764)',
            'linear-gradient(135deg, #151515, #0a3d44)',
            'linear-gradient(135deg, #161616, #3d0a2c)',
            'linear-gradient(135deg, #1c1917, #2e1065)'
        ];

        const STATUS_META = {
            planned: { label: 'Planejado', css: 'status-planned' },
            progress: { label: 'Em andamento', css: 'status-progress' },
            review: { label: 'Em revis&atilde;o', css: 'status-review' },
            done: { label: 'Conclu&iacute;do', css: 'status-done' }
        };

        const STATUS_KEYS = Object.keys(STATUS_META);

        const DEFAULT_PROJECTS = [
            {
                id: 'p1',
                name: 'NovaTech',
                url: '#',
                category: 'Sistema Web',
                status: 'done',
                tech: ['React', 'Node.js', 'PostgreSQL'],
                desc: 'Plataforma completa de gest&atilde;o empresarial com dashboards e relat&oacute;rios em tempo real.',
                date: '2024-11-15',
                color: 0
            },
            {
                id: 'p2',
                name: 'VidaFit',
                url: '#',
                category: 'E-commerce',
                status: 'review',
                tech: ['Next.js', 'Stripe', 'Tailwind'],
                desc: 'Loja virtual de suplementos com sistema de assinaturas e &aacute;rea do cliente.',
                date: '2025-02-03',
                color: 1
            },
            {
                id: 'p3',
                name: 'EcoSolutions',
                url: '#',
                category: 'Landing Page',
                status: 'progress',
                tech: ['HTML', 'CSS', 'JavaScript'],
                desc: 'Site institucional com integra&ccedil;&atilde;o de formul&aacute;rios e sistema de agendamento.',
                date: '2025-05-20',
                color: 2
            },
            {
                id: 'p4',
                name: 'nextpage (este site)',
                url: 'fyrn.html',
                category: 'Landing Page',
                status: 'done',
                tech: ['HTML', 'CSS', 'JavaScript'],
                desc: 'Landing page moderna para a pr&oacute;pria ag&ecirc;ncia, com tema escuro e acento roxo el&eacute;trico.',
                date: '2025-06-29',
                color: 5
            }
        ];

        let projects = loadProjects();
        let currentFilter = 'all';
        let searchQuery = '';
        let editingId = null;

        const grid = document.getElementById('projectsGrid');
        const modal = document.getElementById('projectModal');
        const form = document.getElementById('projectForm');
        const toast = document.getElementById('toast');

        // ---------- Storage ----------
        function loadProjects() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return DEFAULT_PROJECTS.map(function(p) { return Object.assign({}, p); });
        }

        function saveProjects() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
            } catch (e) {}
        }

        // ---------- Utils ----------
        function getInitials(name) {
            var parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function formatDate(iso) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getCoverColor(project) {
            var idx = typeof project.color === 'number' ? project.color : 0;
            return COVER_GRADIENTS[idx % COVER_GRADIENTS.length];
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = String(str || '');
            return div.innerHTML;
        }

        // ---------- Rendering ----------
        function getFilteredProjects() {
            return projects.filter(function(p) {
                if (currentFilter !== 'all' && p.status !== currentFilter) return false;
                if (searchQuery) {
                    var q = searchQuery.toLowerCase();
                    var hay = (p.name + ' ' + (p.category || '') + ' ' + (p.desc || '')).toLowerCase();
                    if (hay.indexOf(q) === -1) return false;
                }
                return true;
            });
        }

        function renderStats() {
            var total = projects.length;
            var done = projects.filter(function(p) { return p.status === 'done'; }).length;
            var progress = projects.filter(function(p) { return p.status === 'progress'; }).length;
            var review = projects.filter(function(p) { return p.status === 'review'; }).length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statProgress').textContent = progress;
            document.getElementById('statReview').textContent = review;
        }

        function renderProjects() {
            var filtered = getFilteredProjects();

            renderStats();

            if (filtered.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
                            '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>' +
                            '<polyline points="14 2 14 8 20 8"></polyline>' +
                        '</svg>' +
                        '<h3>Nenhum projeto encontrado</h3>' +
                        '<p>' + (projects.length === 0 ? 'Adicione seu primeiro projeto no arquivo de origem.' : 'Ajuste a busca ou os filtros para ver mais resultados.') + '</p>' +
                    '</div>';
                return;
            }

            grid.innerHTML = filtered.map(function(p) {
                var meta = STATUS_META[p.status] || STATUS_META.planned;
                var initials = getInitials(p.name);
                var tags = (p.tech || []).map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join('');
                var safeUrl = p.url && p.url !== '#' ? p.url : '#';
                var hasLink = p.url && p.url !== '#';

                return (
                    '<article class="project-card" data-id="' + p.id + '">' +
                        '<div class="project-cover" style="background: ' + getCoverColor(p) + '" data-open="' + p.id + '">' +
                            '<span class="project-initials">' + escapeHtml(initials) + '</span>' +
                            '<div class="project-cover-overlay">' +
                                '<span class="btn btn-primary">' + (hasLink ? 'Abrir Projeto' : 'Sem link') + '</span>' +
                            '</div>' +
                            '<span class="project-status ' + meta.css + '">' + meta.label + '</span>' +
                        '</div>' +
                        '<div class="project-body">' +
                            '<span class="project-category">' + escapeHtml(p.category || '') + '</span>' +
                            '<h3 class="project-name">' + escapeHtml(p.name) + '</h3>' +
                            '<p class="project-desc">' + escapeHtml(p.desc || '') + '</p>' +
                            (tags ? '<div class="project-tags">' + tags + '</div>' : '') +
                            '<div class="project-footer">' +
                                '<span class="project-date">' + (p.date ? formatDate(p.date) : 'Sem data') + '</span>' +
                                '<div class="project-actions">' +
                                    (hasLink ?
                                    '<a href="' + safeUrl + '" target="_blank" rel="noopener" class="project-link-btn">' +
                                        'Abrir' +
                                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                                            '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>' +
                                            '<polyline points="15 3 21 3 21 9"></polyline>' +
                                            '<line x1="10" y1="14" x2="21" y2="3"></line>' +
                                        '</svg>' +
                                    '</a>' : '') +
                                    '<button class="btn-icon" data-edit="' + p.id + '" aria-label="Editar" title="Editar">' +
                                        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                                            '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>' +
                                        '</svg>' +
                                    '</button>' +
                                    '<button class="btn-icon danger" data-delete="' + p.id + '" aria-label="Excluir" title="Excluir">' +
                                        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                                            '<polyline points="3 6 5 6 21 6"></polyline>' +
                                            '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
                                            '<line x1="10" y1="11" x2="10" y2="17"></line>' +
                                            '<line x1="14" y1="11" x2="14" y2="17"></line>' +
                                        '</svg>' +
                                    '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</article>'
                );
            }).join('');
        }

        // ---------- Toast ----------
        var toastTimer = null;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2600);
        }

        // ---------- Modal ----------
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Novo Projeto';
            document.getElementById('modalSave').textContent = 'Salvar Projeto';
            form.reset();
            document.getElementById('projectId').value = '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(function() {
                document.getElementById('projectName').focus();
            }, 150);
        }

        function openEditModal(id) {
            var project = projects.find(function(p) { return p.id === id; });
            if (!project) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Editar Projeto';
            document.getElementById('modalSave').textContent = 'Salvar Altera&ccedil;&otilde;es';
            document.getElementById('projectId').value = id;
            document.getElementById('projectName').value = project.name || '';
            document.getElementById('projectUrl').value = project.url || '';
            document.getElementById('projectCategory').value = project.category || 'Landing Page';
            document.getElementById('projectStatus').value = project.status || 'planned';
            document.getElementById('projectTech').value = (project.tech || []).join(', ');
            document.getElementById('projectDesc').value = project.desc || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            editingId = null;
        }

        // ---------- CRUD ----------
        function handleSubmit(e) {
            e.preventDefault();
            var name = document.getElementById('projectName').value.trim();
            var url = document.getElementById('projectUrl').value.trim();
            if (!name || !url) return;

            var techRaw = document.getElementById('projectTech').value;
            var tech = techRaw.split(',').map(function(t) { return t.trim(); }).filter(Boolean);

            var data = {
                name: name,
                url: url,
                category: document.getElementById('projectCategory').value,
                status: document.getElementById('projectStatus').value,
                tech: tech,
                desc: document.getElementById('projectDesc').value.trim()
            };

            if (editingId) {
                var idx = projects.findIndex(function(p) { return p.id === editingId; });
                if (idx !== -1) {
                    projects[idx] = Object.assign({}, projects[idx], data);
                }
                saveProjects();
                renderProjects();
                showToast('Projeto atualizado!');
            } else {
                var now = new Date().toISOString().slice(0, 10);
                var newProject = Object.assign({}, data, {
                    id: 'p' + Date.now(),
                    date: now,
                    color: projects.length % COVER_GRADIENTS.length
                });
                projects.unshift(newProject);
                saveProjects();
                renderProjects();
                showToast('Projeto adicionado!');
            }
            closeModal();
        }

        function deleteProject(id) {
            var project = projects.find(function(p) { return p.id === id; });
            if (!project) return;
            var ok = window.confirm('Excluir o projeto "' + project.name + '"?');
            if (!ok) return;
            projects = projects.filter(function(p) { return p.id !== id; });
            saveProjects();
            renderProjects();
            showToast('Projeto exclu&iacute;do.');
        }

        // ---------- Events ----------
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalCancel').addEventListener('click', closeModal);
        form.addEventListener('submit', handleSubmit);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            searchQuery = e.target.value.trim();
            renderProjects();
        });

        document.querySelectorAll('.filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderProjects();
            });
        });

        grid.addEventListener('click', function(e) {
            var editBtn = e.target.closest('[data-edit]');
            if (editBtn) {
                openEditModal(editBtn.getAttribute('data-edit'));
                return;
            }
            var delBtn = e.target.closest('[data-delete]');
            if (delBtn) {
                deleteProject(delBtn.getAttribute('data-delete'));
                return;
            }
            var cover = e.target.closest('[data-open]');
            if (cover) {
                var id = cover.getAttribute('data-open');
                var project = projects.find(function(p) { return p.id === id; });
                if (project && project.url && project.url !== '#') {
                    window.open(project.url, '_blank', 'noopener');
                }
            }
        });

        // ---------- Init ----------
        document.getElementById('year').textContent = new Date().getFullYear();
        renderProjects();

        // Scroll Reveal
        var revealObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(function(el) {
            revealObserver.observe(el);
        });

        // Parallax suave ao rolar
        var parallaxEls = document.querySelectorAll('[data-parallax]');
        var ticking = false;

        function updateParallax() {
            ticking = false;
            // Fundo fixo na viewport: movimento continuo conforme o scroll da pagina
            var scrolled = window.pageYOffset;

            parallaxEls.forEach(function(el) {
                var speed = parseFloat(el.getAttribute('data-parallax')) || 0;
                var baseY = parseFloat(el.getAttribute('data-parallax-y')) || 0;
                var translateY = -scrolled * speed + baseY;
                el.style.transform = 'translate3d(0, ' + translateY + 'px, 0)';
            });
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                requestAnimationFrame(updateParallax);
                ticking = true;
            }
        }, { passive: true });

        updateParallax();
    })();
    </script>
</body>
